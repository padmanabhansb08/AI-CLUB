version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: aiclub_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aiclub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aiclub_password}
      POSTGRES_DB: ${POSTGRES_DB:-aiclub_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aiclub} -d ${POSTGRES_DB:-aiclub_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - aiclub_network

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: aiclub_api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-aiclub}:${POSTGRES_PASSWORD:-aiclub_password}@db:5432/${POSTGRES_DB:-aiclub_db}
      JWT_SECRET: ${JWT_SECRET:-production_jwt_secret_change_me_immediately_in_prod}
      JWT_EXPIRES_IN: 7d
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      AI_ENABLED: "true"
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - aiclub_network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aiclub_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - aiclub_network

volumes:
  postgres_data:
    driver: local

networks:
  aiclub_network:
    driver: bridge
