version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: aiclub_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aiclub
      POSTGRES_PASSWORD: aiclub_password
      POSTGRES_DB: aiclub_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiclub -d aiclub_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
