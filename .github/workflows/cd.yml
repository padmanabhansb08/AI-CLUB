name: AI CLUB CD Deployment Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Deployment Target Environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

concurrency:
  group: deployment-${{ github.event.inputs.target_env || 'production' }}
  cancel-in-progress: false

jobs:
  pre-deploy-validation:
    name: Pre-Deployment Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 20
          cache: 'npm'

      - name: Install and Build Verification
        run: |
          npm ci
          npm run build
          cd server && npm ci && npm run build

  deploy-staging:
    name: Deploy to Staging Environment
    runs-on: ubuntu-latest
    needs: pre-deploy-validation
    environment:
      name: staging
      url: https://staging.aiclub.internal
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Execute Controlled Database Migration
        run: |
          echo "Simulating/Executing staging migration: npm --prefix server run db:migrate"

      - name: Deploy Container Images
        run: |
          echo "Deploying Staging Container Stack: docker compose up -d"

      - name: Run Staging Smoke Verification
        run: |
          echo "Verifying Staging Health: GET /health and GET /ready"

  deploy-production:
    name: Deploy to Production Environment (Approval Gated)
    runs-on: ubuntu-latest
    needs: deploy-staging
    environment:
      name: production
      url: https://aiclub.internal
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Execute Controlled Production Migration
        run: |
          echo "Executing backward-compatible production migration step..."

      - name: Deploy Production Application Stack
        run: |
          echo "Deploying zero-downtime production containers..."

      - name: Post-Deployment Smoke Test
        run: |
          echo "Running Production Smoke Test Suite: /health, /ready, Auth, Catalog"
